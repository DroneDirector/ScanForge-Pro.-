plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing: key.properties is written by the build workflow from secrets.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { keystoreProperties.load(it) }
}

// OpenCV Android SDK (Apache 2.0), downloaded by the build workflow.
def opencvSdk = System.getenv("OPENCV_ANDROID_SDK") ?: rootProject.file("../../third_party/OpenCV-android-sdk").absolutePath

android {
    namespace = "fo.dronedirector.scanforgepro"
    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "fo.dronedirector.scanforgepro"
        minSdk = 26
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                        "-DOpenCV_DIR=${opencvSdk}/sdk/native/jni",
                        "-DOpenCV_STATIC=ON",
                        "-DCMAKE_BUILD_TYPE=Release"
                cppFlags "-frtti -fexceptions"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../../../engine/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    androidResources {
        noCompress += "tflite"
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    // ARCore (Live Scan): camera tracking and depth
    implementation "com.google.ar:core:1.45.0"
    // MediaPipe (Apache 2.0): AI object selection
    implementation "com.google.mediapipe:tasks-vision:0.10.14"
}
