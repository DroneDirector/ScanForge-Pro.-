name: scanforge_pro
description: ScanForge Pro - turn photos into printable 3D models.
publish_to: 'none'
version: 1.1.1+9

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  sensors_plus: ^6.1.0
  path_provider: ^2.1.4
  path: ^1.9.0
  share_plus: ^10.1.0
  file_picker: ^8.1.4
  ffi: ^2.1.3
  wakelock_plus: ^1.2.8
  exif: ^3.3.0
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
